<section class="hero">
  <div>
    <span class="ch-no">00 / OVERVIEW</span>
    <h1>Agent 基本原理</h1>
  </div>
  <div class="hloop" aria-hidden="true">
    <svg viewBox="0 0 200 200">
      <path class="arc" d="M100 34 A66 66 0 0 1 100 166"></path>
      <path class="arc arc-b" d="M100 166 A66 66 0 0 1 100 34"></path>
      <circle class="ring" cx="100" cy="100" r="66"></circle>
      <circle class="dot-a" cx="100" cy="34" r="6"></circle>
      <circle class="dot-b" cx="100" cy="166" r="6"></circle>
    </svg>
    <span class="lab lab-a">model_call</span>
    <span class="lab lab-b">tool_call</span>
  </div>
</section>

<p class="lede">我把 agent 的发展和知识压成了一条因果链：每一层解决一件事，同时留下一个问题，下一层来解决它。</p>

<p>链分五层，一层只解决一件事，解决完再把下一个问题交给下一层。</p>

<ul class="bul">
  <li><b>L1</b> 是模型本身。</li>
  <li><b>L2</b> 是模型长出的手。</li>
  <li><b>L3</b> 把模型和手串成一个循环——到这里，模型才有能力干完一件事。</li>
  <li><b>L4</b> 长在循环外面，让模型可控地干完一件事。</li>
  <li><b>L5</b> 再往外一层，让用户能更好地观测这个黑盒子。</li>
</ul>


<div class="map-grid">
  <div class="stack" id="stack">
    <button class="layer" data-v="llm" data-c="model" aria-pressed="true">
      <span class="ln">L1</span>
      <span><span class="lt">语言模型</span><span class="ls">能理解意图，能生成 token</span></span>
      <span class="lc">01</span>
    </button>
    <button class="layer" data-v="tool" data-c="tool" aria-pressed="false">
      <span class="ln">L2</span>
      <span><span class="lt">工具调用</span><span class="ls">模型输出参数，宿主负责执行</span></span>
      <span class="lc">02</span>
    </button>
    <button class="layer" data-v="loop" data-c="loop" aria-pressed="false">
      <span class="ln">L3</span>
      <span><span class="lt">循环</span><span class="ls">model ⇄ tool，全量重放历史</span></span>
      <span class="lc">03 · 04</span>
    </button>
    <button class="layer" data-v="mid" data-c="mid" aria-pressed="false">
      <span class="ln">L4</span>
      <span><span class="lt">中间件</span><span class="ls">在节点前后插拦截层</span></span>
      <span class="lc">05–09</span>
    </button>
    <button class="layer" data-v="ui" data-c="ui" aria-pressed="false">
      <span class="ln">L5</span>
      <span><span class="lt">流式前端</span><span class="ls">把内部事件变成可见的过程</span></span>
      <span class="lc">10</span>
    </button>
  </div>

  <div class="detail" id="detail"></div>
</div>

__PAGER__

<script>
(function () {
  const DATA = {
    llm: {
      ch: '01 · LLM 的四次跃迁', name: 'L1 · 语言模型',
      ps: [
        '模型把一句模糊的意图压成一个可计算的分布，再从里面采样出下一个 token。2022 年底的 RLHF 把「会说话」推成了「愿意配合」，agent 第一次有了可以听指挥的大脑。',
        '但它只有语言这一个动作。它没有执行能力，也看不见外部世界；你告诉它文件在哪，它也只能猜内容。'
      ]
    },
    tool: {
      ch: '02 · 工具调用的演进', name: 'L2 · 工具调用',
      ps: [
        '模型学会输出结构化的参数，由宿主程序去执行，执行结果再作为一条消息塞回来。它从此有了手：读文件、跑命令、查数据库，都不必再靠猜。',
        '手却是宿主替它动的，而且一次只动一下。做完一步要先看结果、再决定下一步，这套往复还没有机制承载。'
      ]
    },
    loop: {
      ch: '03 · 形态谱系 / 04 · ReAct 循环', name: 'L3 · 循环',
      ps: [
        '把模型调用和工具调用装进一个 while：每一轮把全部历史原样重放，模型以此代替记忆，边做边看，直到它自己认为可以收工。',
        '代价是三个结构性缺陷：上下文只增不减，参数不经检查就进了执行器，任务算不算完成由模型自己说了算。这三件都不是改提示词能解决的，得往循环里插钩子。'
      ]
    },
    mid: {
      ch: '05–09 · 中间件', name: 'L4 · 中间件',
      ps: [
        '在模型、工具、agent 的进出各开一个钩子，把压缩、卸载、追踪、审批、重试、验收做成可复用的拦截层。同一套钩子，换一种用法就是另一种中间件。',
        '循环因此变得可控、可查，但用户这边仍是黑箱：一个转圈的图标，然后突然是一段结论。长任务的过程没有出口。'
      ]
    },
    ui: {
      ch: '10 · 流式与前端', name: 'L5 · 流式前端',
      ps: [
        '把内部事件实时推出去，前端按事件类型渲染：模型吐字就长气泡，工具执行就开终端框。一个跑四十秒的任务，被拆成看得见的每一步。链到这里走完：它会说话、有手、能自己循环、被拦得住，最后把过程摊开在人眼前。'
      ]
    }
  };

  const detail = $('#detail');
  function show(k) {
    const d = DATA[k];
    detail.innerHTML =
      '<span class="dl">' + d.ch + '</span>' +
      '<h3>' + d.name + '</h3>' +
      d.ps.map(function (t) { return '<p>' + t + '</p>'; }).join('');
  }

  $$('.layer').forEach(function (b) {
    b.addEventListener('click', function () {
      $$('.layer').forEach(function (o) { o.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      show(b.dataset.v);
    });
  });
  show('llm');
})();
</script>
