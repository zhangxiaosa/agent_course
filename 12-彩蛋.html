<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12 · 彩蛋</title>
<meta name="description" content="Agent 基本原理交互教程：LLM 演进、工具调用、ReAct 循环、中间件、流式前端。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0e13'/%3E%3Crect x='7' y='9' width='18' height='2.5' fill='%235b93c9'/%3E%3Crect x='7' y='15' width='12' height='2.5' fill='%23dda15c'/%3E%3Crect x='7' y='21' width='18' height='2.5' fill='%234fb0bd'/%3E%3C/svg%3E">
<style>
/* ============================================================
   Agent 原理教程 · 设计系统
   语汇：工程手册 / 仪器面板。深蓝黑底 + 网格纸 + 单一语义色板。
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

:root {
  --bg:        #ffffff;
  --bg-2:      #fbfcfd;
  --panel:     #ffffff;
  --panel-2:   #f4f6f9;
  --line:      #e2e6eb;
  --line-2:    #ccd3db;

  --text:      #15191e;
  --text-2:    #495260;
  --text-3:    #6b7482;

  --blue:      #2563a8;
  --cyan:      #0f7b83;
  --amber:     #a9660f;
  --red:       #b3261e;
  --green:     #1f7a3d;
  --grey:      #8b95a3;

  --sans: "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans CJK SC",
          "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --gut: 18px;
  --r: 3px;
}

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.72;
  -webkit-font-smoothing: antialiased;
}

::selection { background: rgba(169,102,15,0.154); }

a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- 布局骨架 ---------- */

.shell { display: block; }

.side {
  position: sticky; top: 0; z-index: 30;
  background: rgba(255,255,255,0.94);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  padding: 9px 14px 7px;
}
.side-brand { display: none; }
.side-list {
  display: flex; gap: 5px; overflow-x: auto;
  scrollbar-width: none; -ms-overflow-style: none;
  padding-bottom: 2px;
}
.side-list::-webkit-scrollbar { display: none; }

.side-item {
  flex: 0 0 auto;
  display: flex; align-items: baseline; gap: 6px;
  padding: 5px 9px;
  border: 1px solid transparent;
  border-radius: var(--r);
  font-size: 12.5px; color: var(--text-2);
  white-space: nowrap;
  transition: color .16s, background .16s, border-color .16s;
}
.side-item:hover { color: var(--text); background: var(--panel); text-decoration: none; }
.side-item .n { font-family: var(--mono); font-size: 10px; color: var(--text-3); }
.side-item[aria-current] {
  color: var(--text); background: var(--panel-2);
  border-color: var(--line-2);
}
.side-item[aria-current] .n { color: var(--amber); }

main { padding: var(--gut) var(--gut) 96px; min-width: 0; }
.wrap { max-width: 1160px; }

/* ---------- 章节头 ---------- */

.ch-head { margin: 8px 0 30px; border-bottom: 1px solid var(--line); padding-bottom: 20px; }
.ch-no {
  font-family: var(--mono); font-size: 11px; letter-spacing: .14em;
  color: var(--amber); margin-bottom: 10px; display: block;
}
.ch-head h1 {
  margin: 0 0 12px;
  font-size: clamp(25px, 5.2vw, 40px);
  font-weight: 600;
  line-height: 1.16;
  letter-spacing: -.025em;
  color: #10141a;
}
.ch-lede {
  margin: 0; max-width: 62ch;
  font-size: 15px; line-height: 1.72; color: var(--text-2);
}
.ch-lede b { color: var(--text); font-weight: 500; }

/* ---------- 正文 ---------- */

h2 {
  margin: 46px 0 14px;
  font-size: 19px; font-weight: 600; letter-spacing: -.01em;
  color: #10141a;
}
h3 { margin: 26px 0 8px; font-size: 15.5px; font-weight: 600; color: #15191e; }

p { margin: 0 0 14px; max-width: 72ch; }
p.lede { color: var(--text-2); }
ul, ol { margin: 0 0 16px; padding-left: 20px; max-width: 72ch; }
li { margin-bottom: 7px; }
li::marker { color: var(--text-3); }

code, .kbd {
  font-family: var(--mono);
  font-size: .88em;
  background: var(--panel-2);
  border: 1px solid var(--line);
  padding: .08em .38em;
  border-radius: 2px;
  color: #2f3a47;
}
.kbd { color: var(--amber); border-color: var(--line-2); }

pre {
  margin: 0 0 18px;
  padding: 13px 15px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-left: 2px solid var(--line-2);
  border-radius: var(--r);
  overflow-x: auto;
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.68;
  color: #343f4c;
}
pre code { background: none; border: 0; padding: 0; font-size: inherit; color: inherit; }

/* ---------- 通用块 ---------- */

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 15px 16px;
}
.card-h {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em;
  color: var(--text-3); margin-bottom: 9px; display: block;
}

.note {
  display: grid; grid-template-columns: 3px minmax(0,1fr);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
  margin: 0 0 18px;
  overflow: hidden;
}
.note > .bar { background: var(--grey); }
.note > .body { padding: 12px 15px; min-width: 0; font-size: 14px; color: var(--text-2); }
.note > .body b { color: var(--text); font-weight: 500; }
.note[data-t="correction"] > .bar { background: var(--amber); }
.note[data-t="risk"] > .bar { background: var(--red); }
.note[data-t="good"] > .bar { background: var(--green); }

.tag {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 10.5px;
  padding: 2px 7px; border-radius: 2px;
  border: 1px solid currentColor; color: var(--text-3);
  line-height: 1.5; white-space: nowrap;
}
.tag[data-c="model"] { color: var(--blue); }
.tag[data-c="tool"]  { color: var(--cyan); }
.tag[data-c="hook"]  { color: var(--amber); }
.tag[data-c="risk"]  { color: var(--red); }
.tag[data-c="ok"]    { color: var(--green); }

/* 表格：列宽显式给 */
.tbl-wrap { overflow-x: auto; margin: 0 0 20px; border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th {
  font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .06em;
  color: var(--text-3); background: var(--panel); white-space: nowrap;
}
td { color: var(--text-2); }
td b { color: var(--text); font-weight: 500; }
tr:last-child td { border-bottom: 0; }

/* ---------- 时间轴（章节 01） ---------- */

.tl { position: relative; margin: 26px 0 10px; }
.tl::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 7px; width: 1px;
  background: linear-gradient(180deg, var(--line-2), var(--line) 92%, transparent);
}
.tl-item {
  position: relative; padding: 0 0 22px 30px;
  display: grid; grid-template-columns: minmax(0,1fr); gap: 4px;
}
.tl-dot {
  position: absolute; left: 2px; top: 5px;
  width: 11px; height: 11px; border-radius: 50%;
  border: 1px solid var(--line-2); background: var(--bg);
  transition: border-color .2s, background .2s, box-shadow .2s;
}
.tl-item[data-open] .tl-dot { border-color: var(--amber); background: var(--amber); box-shadow: 0 0 14px -2px var(--amber); }
.tl-when { font-family: var(--mono); font-size: 11px; color: var(--amber); letter-spacing: .04em; }
.tl-name { font-size: 15.5px; font-weight: 600; color: #10141a; }
.tl-sub { font-size: 13px; color: var(--text-3); }
.tl-panel {
  margin: 10px 0 0; padding: 12px 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
  font-size: 13.5px; color: var(--text-2);
}
.tl-item { cursor: pointer; }
.tl-item:hover .tl-name { color: #15191e; }

/* ---------- 跑道式循环图 ---------- */

.flow {
  position: relative;
  height: 340px;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(37,99,168,0.033), transparent 60%),
    var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
}
.flow-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.edge {
  fill: none; stroke: #ccd3db; stroke-width: 1.4;
  vector-effect: non-scaling-stroke;
  transition: stroke .22s;
}
.edge.on { stroke: var(--amber); stroke-width: 1.8; }
.edge.on.flow { stroke-dasharray: 5 5; animation: dashfwd .6s linear infinite; }
.edge.on.flow.up { animation-direction: reverse; }
.edge.loop { stroke: #ccd3db; }
@keyframes dashfwd { to { stroke-dashoffset: -10; } }

.fnode {
  position: absolute; transform: translate(-50%,-50%);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 9px; line-height: 1;
  letter-spacing: -.012em; white-space: nowrap;
  padding: 7px 8px; border-radius: 3px;
  border: 1px solid var(--grey);
  background: #f7f9fb; color: var(--text-3);
  transition: border-color .2s, color .2s, background .2s, box-shadow .2s, opacity .2s;
  cursor: default;
}
.fnode[data-k="model"] { border-color: #d3dcea; color: #2f5f8f; }
.fnode[data-k="tool"]  { border-color: #d4e6e7; color: #14676e; }
.fnode[data-k="hook"]  { border-color: #eee1d2; color: #8a5a12; }
.fnode[data-k="done"]  { border-color: #d6e6d9; color: #2f6b45; }
.fnode.on {
  color: #15191e; background: #eef1f5;
  border-color: var(--amber);
  box-shadow: 0 0 0 1px var(--amber), 0 0 26px -6px rgba(169,102,15,0.49);
  z-index: 3;
}
.fnode.on[data-k="model"] { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue), 0 0 26px -6px rgba(37,99,168,0.56); }
.fnode.on[data-k="tool"]  { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 0 26px -6px rgba(15,123,131,0.56); }
.fnode.on[data-k="done"]  { border-color: var(--green); box-shadow: 0 0 0 1px var(--green), 0 0 26px -6px rgba(31,122,61,0.56); }
.fnode.visited { opacity: .82; }
.fnode.skip { opacity: .34; text-decoration: line-through; text-decoration-color: var(--line-2); }

.flow-meta {
  position: absolute; left: 10px; bottom: 8px;
  font-family: var(--mono); font-size: 10px; color: var(--text-3);
  letter-spacing: .02em; pointer-events: none;
}
.flow-meta b { color: var(--amber); font-weight: 400; }

/* 循环带：把 while 的存在感画出来 */
.loopband {
  position: absolute; left: 14%; right: 14%; top: 26%; bottom: 44%;
  border: 1px solid #e7ebf0;
  background: rgba(37,99,168,0.019);
  border-radius: 6px;
  pointer-events: none;
}
.loopband span {
  position: absolute; top: -8px; left: 12px;
  background: var(--bg-2); padding: 0 7px;
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .05em;
  color: #6b7482;
}

/* ---------- 三栏舞台 ---------- */

.stage { margin: 22px 0 8px; display: grid; grid-template-columns: minmax(0,1fr); gap: 10px; }
@media (min-width: 760px) {
  .stage { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
  .stage .flow-cell { grid-column: 1 / -1; }
}
@media (min-width: 1120px) {
  .stage { grid-template-columns: minmax(0,1.45fr) minmax(0,.82fr) minmax(0,1fr); align-items: stretch; }
  .stage .flow-cell { grid-column: auto; }
  .stage.wide { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .stage.wide .flow-cell { grid-column: 1 / -1; }
}
@media (min-width: 760px) {
  .stage.wide { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .stage.wide .flow-cell { grid-column: 1 / -1; }
}

.flow-cell { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

.col { display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.col-h {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 11px; border-bottom: 1px solid var(--line);
  font-family: var(--mono); font-size: 10px; letter-spacing: .07em; color: var(--text-3);
  flex: 0 0 auto;
}
.col-h .live { color: var(--amber); }
.col-body { flex: 1 1 auto; overflow-y: auto; min-height: 0; }

/* checkpoint */
.st-body { padding: 9px 11px; font-family: var(--mono); font-size: 11.5px; line-height: 1.72; }
.st-row {
  display: grid; grid-template-columns: 92px minmax(0,1fr);
  gap: 8px; padding: 1px 0;
  transition: background .3s;
}
.st-k { color: var(--text-3); }
.st-v { color: #3a4552; word-break: break-word; }
.st-v em { color: var(--amber); font-style: normal; }
.st-row.flash { background: rgba(169,102,15,0.072); }
.st-row.flash .st-k { color: var(--amber); }
.st-empty { color: var(--text-3); padding: 9px 11px; font-family: var(--mono); font-size: 11.5px; }

/* 对话记录 */
.log-body { padding: 2px 0; }
.msg {
  display: grid; grid-template-columns: 54px minmax(0,1fr); gap: 6px;
  padding: 8px 10px;
  border-bottom: 1px solid rgba(0,0,0,0.072);
  font-size: 12px; line-height: 1.6;
  animation: msgIn .22s ease-out;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.msg:last-child { border-bottom: 0; }
.msg-r { font-family: var(--mono); font-size: 9.5px; padding-top: 3px; color: var(--text-3); letter-spacing: .02em; }
.msg[data-r="user"] .msg-r { color: var(--amber); }
.msg[data-r="assistant"] .msg-r { color: var(--blue); }
.msg[data-r="tool"] .msg-r { color: var(--cyan); }
.msg[data-r="summary"] .msg-r { color: var(--amber); }
.msg[data-r="summary"] .msg-b { color: #7a5210; }
.msg[data-r="muted"] .msg-r { color: var(--text-3); }
.msg[data-r="muted"] .msg-b { color: var(--text-3); }
.msg[data-r="judge"] .msg-r { color: var(--red); }
.msg[data-r="human"] .msg-r { color: var(--red); }
.msg-b { white-space: pre-wrap; word-break: break-word; color: #2f3a47; min-width: 0; }
.msg[data-r="user"] .msg-b { color: #15191e; }
.msg-b .j { color: #33608f; }
.msg-b .warn { color: var(--red); }
.msg-b .ok { color: var(--green); }

/* ---------- 控制条 ---------- */

.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
  padding: 8px 10px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r);
}
.btn {
  appearance: none; border: 1px solid var(--line-2); background: var(--panel-2);
  color: var(--text); font-family: var(--sans); font-size: 12.5px;
  padding: 7px 13px; border-radius: 2px; cursor: pointer;
  min-height: 34px; display: inline-flex; align-items: center; gap: 6px;
  transition: border-color .15s, background .15s, color .15s;
}
.btn:hover:not(:disabled) { border-color: var(--amber); color: #15191e; }
.btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn[data-v="primary"] { background: #faf1e4; border-color: #7a5313; color: #7a5210; }
.btn[data-v="ghost"] { background: transparent; }
.btn[data-v="danger"] { border-color: #d9a8a3; color: #a83a33; }
.btn-sm { font-size: 11.5px; padding: 5px 10px; min-height: 30px; }

.step-no { font-family: var(--mono); font-size: 11px; color: var(--text-3); margin-left: auto; }
.step-no b { color: var(--amber); font-weight: 400; }

.caption {
  padding: 10px 12px; min-height: 62px;
  background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r);
  font-size: 12.5px; line-height: 1.62; color: var(--text-2);
}
.caption .cap-k { font-family: var(--mono); font-size: 10px; color: var(--amber); display: block; margin-bottom: 3px; }

/* ---------- 终端 / shell 演示 ---------- */

.term {
  background: #ffffff; border: 1px solid var(--line); border-radius: var(--r);
  font-family: var(--mono); font-size: 12px; line-height: 1.62;
  padding: 10px 12px; min-height: 96px;
  white-space: pre-wrap; word-break: break-all;
  color: #2f3a47;
}
.term .p { color: var(--cyan); }
.term .d { color: var(--text-2); }
.term .c { color: var(--amber); }
.caret { display: inline-block; width: 6px; height: 13px; background: var(--amber); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

/* ---------- 事件流（章节 10） ---------- */

.ev-list { padding: 4px 0; }
.ev {
  display: grid; grid-template-columns: 62px minmax(0,1fr);
  gap: 7px; padding: 3px 10px;
  font-family: var(--mono); font-size: 10.5px; line-height: 1.6;
  border-left: 2px solid transparent;
  transition: background .2s, border-color .2s;
}
.ev .ev-t { color: var(--text-3); }
.ev .ev-n { color: #3f4a58; word-break: break-all; }
.ev.on { background: rgba(169,102,15,0.05); border-left-color: var(--amber); }
.ev.on .ev-t { color: var(--amber); }
.ev[data-k="llm"] .ev-n { color: #33608f; }
.ev[data-k="tool"] .ev-n { color: #0f6b72; }
.ev .ev-p { color: var(--text-3); }

/* ---------- 矩阵（章节 05） ---------- */

.mx { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
.mx-table { border-collapse: collapse; table-layout: fixed; width: 100%; min-width: 660px; }
.mx-table th {
  background: var(--panel); font-family: var(--mono); font-size: 9.5px;
  letter-spacing: 0; color: var(--text-3); padding: 7px 4px; text-align: center;
  white-space: normal; line-height: 1.35;
}
.mx-table th:first-child { width: 148px; text-align: left; padding-left: 11px; }
.mx-table td { padding: 4px; text-align: center; border-left: 1px solid rgba(0,0,0,0.064); }
.mx-table tbody tr:first-child td { border-top: 1px solid var(--line); }
.mx-cell {
  display: block; width: 100%; height: 30px; border-radius: 2px;
  border: 1px solid var(--line); background: var(--bg-2);
  cursor: pointer; transition: background .15s, border-color .15s;
}
.mx-cell[data-v="1"] { background: rgba(37,99,168,0.11); border-color: rgba(37,99,168,0.385); }
.mx-cell[data-v="2"] { background: rgba(169,102,15,0.11); border-color: rgba(169,102,15,0.42); }
.mx-cell[data-v="3"] { background: rgba(179,38,30,0.099); border-color: rgba(179,38,30,0.385); }
.mx-cell:hover { outline: 1px solid var(--amber); outline-offset: 1px; }
.mx-cell.sel { outline: 2px solid var(--amber); outline-offset: 1px; }
.mx-rowname { font-size: 12px; color: var(--text-2); text-align: left; padding-left: 11px !important; white-space: nowrap; }
.mx-rowname b { color: var(--text); font-weight: 500; }

/* ---------- 形态谱系（章节 03） ---------- */

.seg { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
.seg-btn {
  appearance: none; cursor: pointer; font-family: var(--sans); font-size: 12.5px;
  padding: 6px 12px; min-height: 34px;
  background: transparent; color: var(--text-2);
  border: 1px solid var(--line); border-radius: 2px;
  transition: all .15s;
}
.seg-btn[aria-selected="true"] { background: var(--panel-2); border-color: var(--amber); color: #15191e; }
.seg-btn:hover { color: var(--text); }

/* ToT 分支 */
.tot { position: relative; height: 240px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.tnode {
  position: absolute; transform: translate(-50%,-50%);
  font-family: var(--mono); font-size: 10px; padding: 5px 8px;
  border: 1px solid var(--line-2); border-radius: 3px; background: #f7f9fb; color: var(--text-3);
  white-space: nowrap; transition: all .2s;
}
.tnode[data-s="ok"] { border-color: var(--green); color: #2f6b45; }
.tnode[data-s="bad"] { border-color: var(--red); color: #a83a33; }
.tnode[data-s="cur"] { border-color: var(--amber); color: #15191e; box-shadow: 0 0 20px -6px var(--amber); }
.tnode[data-k] { cursor: pointer; }
.tnode[data-k]:hover { border-color: var(--amber); color: var(--text); }

/* Plan-and-Execute 面板 */
.fig.pe { height: auto; padding: 13px; display: grid; gap: 10px; }
@media (min-width: 720px) { .fig.pe { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } }
.pe-box { border: 1px solid var(--line); border-radius: 3px; background: #fbfcfd; padding: 10px 11px; min-width: 0; }
.pe-h { font-family: var(--mono); font-size: 9.5px; color: var(--text-3); letter-spacing: .05em; display: block; margin-bottom: 6px; }
.pe-row {
  display: grid; grid-template-columns: 14px minmax(0,1fr) auto; gap: 7px; align-items: center;
  font-size: 11.5px; padding: 5px 0; border-bottom: 1px solid var(--line); color: var(--text-2);
  min-width: 0;
}
.pe-row:last-child { border-bottom: 0; }
.pe-row > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pe-row .st { font-family: var(--mono); font-size: 10px; color: var(--text-3); }
.pe-row[data-s="run"] .st { color: var(--amber); }
.pe-row[data-s="ok"]  .st { color: var(--green); }
.pe-row[data-s="bad"] .st { color: var(--red); }
.pe-row[data-s="ok"] > span:nth-child(2) { color: var(--text); }

/* ---------- 审批卡片（章节 08） ---------- */

.approve {
  border: 1px solid #d9a8a3; border-radius: var(--r);
  background: linear-gradient(180deg, rgba(179,38,30,0.05), rgba(179,38,30,0.011));
  padding: 12px;
  animation: msgIn .24s ease-out;
}
.approve-h { font-family: var(--mono); font-size: 10px; color: var(--red); letter-spacing: .08em; margin-bottom: 8px; display: flex; justify-content: space-between; }
.approve-q { font-size: 12.5px; color: #3a424e; margin-bottom: 10px; }
.approve-cmd {
  font-family: var(--mono); font-size: 11.5px; background: #ffffff;
  border: 1px solid var(--line); border-radius: 2px; padding: 8px 10px;
  color: #8f1d18; margin-bottom: 11px; word-break: break-all;
}
.approve-row { display: flex; gap: 7px; flex-wrap: wrap; }

/* ---------- 分页 footer ---------- */

.pager {
  display: grid; grid-template-columns: minmax(0,1fr); gap: 8px;
  margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line);
}
@media (min-width: 620px) { .pager { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } }
.pager a {
  display: block; padding: 11px 14px;
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--panel); color: var(--text-2); font-size: 13px;
  transition: border-color .15s, color .15s;
}
.pager a:hover { border-color: var(--line-2); color: var(--text); text-decoration: none; }
.pager a .dir { font-family: var(--mono); font-size: 10px; color: var(--text-3); display: block; margin-bottom: 2px; }
.pager .next { text-align: right; }

/* ---------- 语义图例 ---------- */

.legend { display: flex; flex-wrap: wrap; gap: 12px; font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; border: 1px solid currentColor; display: inline-block; }

/* ---------- 宽屏侧栏 ---------- */

@media (min-width: 980px) {
  .shell { display: grid; grid-template-columns: 226px minmax(0,1fr); align-items: start; }
  .side {
    height: 100vh; padding: 26px 16px;
    border-bottom: 0; border-right: 1px solid var(--line);
    overflow-y: auto;
  }
  .side-brand { display: block; margin-bottom: 20px; }
  .side-brand .t { font-size: 13px; font-weight: 600; color: #10141a; letter-spacing: -.01em; line-height: 1.4; display: block; }
  .side-brand .s { font-family: var(--mono); font-size: 9.5px; color: var(--text-3); display: block; margin-top: 4px; }
  .side-list { flex-direction: column; gap: 1px; overflow: visible; }
  .side-item { padding: 6px 9px; font-size: 12.5px; }
  .side-item .n { min-width: 16px; }
  main { padding: 52px 44px 128px; }
  .flow { height: 330px; }
}

@media (min-width: 1320px) {
  main { padding: 60px 64px 140px; }
  .flow { height: 356px; }
}

/* ---------- hero（章节 00） ---------- */

.hero {
  display: grid; gap: 26px; margin: 6px 0 34px;
  border-bottom: 1px solid var(--line); padding-bottom: 30px;
}
@media (min-width: 860px) {
  .hero { grid-template-columns: minmax(0,1fr) 196px; align-items: center; gap: 44px; }
}
.hero h1 {
  margin: 0 0 14px;
  font-size: clamp(31px, 6.4vw, 54px);
  font-weight: 600; line-height: 1.06; letter-spacing: -.035em;
  color: #10141a;
}
.hero-sub { margin: 0; max-width: 54ch; font-size: 16px; line-height: 1.7; color: var(--text-2); }

.hloop { position: relative; width: 176px; height: 176px; margin: 0 auto; flex: 0 0 auto; }
.hloop svg { width: 100%; height: 100%; display: block; }
.hloop .ring {
  stroke: #ccd3db; stroke-width: 1; fill: none; stroke-dasharray: 7 9;
  animation: spin 14s linear infinite; transform-origin: 50% 50%;
}
@keyframes spin { to { transform: rotate(360deg); } }
.hloop .arc { fill: none; stroke: rgba(37,99,168,0.21); stroke-width: 1.4; }
.hloop .arc-b { stroke: rgba(15,123,131,0.21); }
.hloop .dot-a { fill: var(--blue); animation: dotA 2.8s ease-in-out infinite; }
.hloop .dot-b { fill: var(--cyan); animation: dotB 2.8s ease-in-out infinite; }
@keyframes dotA { 0%,40% { opacity: 1; } 55%,95% { opacity: .28; } 100% { opacity: 1; } }
@keyframes dotB { 0%,40% { opacity: .28; } 55%,95% { opacity: 1; } 100% { opacity: .28; } }
.hloop .lab {
  position: absolute; font-family: var(--mono); font-size: 9.5px; letter-spacing: -.01em;
  color: var(--text-3); white-space: nowrap;
}
.hloop .lab-a { top: 1%; left: 50%; transform: translateX(-50%); color: #2f5f8f; }
.hloop .lab-b { bottom: 0; left: 50%; transform: translateX(-50%); color: #14676e; }

/* ---------- 层叠地图（章节 00） ---------- */

.stack { display: flex; flex-direction: column; gap: 5px; }
.layer {
  display: grid; grid-template-columns: 34px minmax(0,1fr) auto;
  align-items: center; gap: 11px;
  padding: 11px 13px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-left: 2px solid var(--grey);
  border-radius: var(--r);
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  transition: border-color .18s, background .18s;
}
.layer:hover { border-color: var(--line-2); background: var(--panel-2); }
.layer[aria-pressed="true"] { background: var(--panel-2); border-color: var(--line-2); }
.layer .ln { font-family: var(--mono); font-size: 10px; color: var(--text-3); }
.layer .lt { font-size: 14px; color: var(--text); font-weight: 500; }
.layer .ls { display: block; font-size: 11.5px; color: var(--text-3); font-weight: 400; margin-top: 1px; }
.layer .lc { font-family: var(--mono); font-size: 10px; color: var(--text-3); }
.layer[aria-pressed="true"] .lc { color: var(--amber); }
.layer[data-c="model"] { border-left-color: var(--blue); }
.layer[data-c="tool"]  { border-left-color: var(--cyan); }
.layer[data-c="loop"]  { border-left-color: var(--amber); }
.layer[data-c="mid"]   { border-left-color: var(--green); }
.layer[data-c="ui"]    { border-left-color: var(--red); }

.detail {
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--bg-2); padding: 15px 16px;
  min-height: 190px;
}
.detail h3 { margin: 0 0 6px; font-size: 15px; }
.detail .dl { font-family: var(--mono); font-size: 10px; color: var(--amber); letter-spacing: .06em; display: block; margin-bottom: 9px; }
.detail p { font-size: 13.5px; line-height: 1.68; margin-bottom: 10px; }
.detail .kv { display: grid; grid-template-columns: 112px minmax(0,1fr); gap: 10px; font-size: 12.5px; margin-bottom: 5px; }
.detail .kv .k { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); padding-top: 2px; }
.detail .kv .v { color: var(--text-2); }

@media (min-width: 820px) {
  .map-grid { display: grid; grid-template-columns: minmax(0,1.05fr) minmax(0,1fr); gap: 14px; align-items: start; }
}

/* ---------- 能力栈 ---------- */

.capa { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--line); }
.capa span {
  font-family: var(--mono); font-size: 10px; line-height: 1;
  padding: 4px 8px; border-radius: 2px;
  border: 1px solid var(--line); color: var(--text-3);
  transition: border-color .2s, color .2s, background .2s;
}
.capa span.on { border-color: var(--amber); color: var(--amber); background: rgba(169,102,15,0.047); }

/* ---------- 三卡横排 / 双栏代码对照 ---------- */

.mrow { display: grid; gap: 10px; margin: 0 0 22px; }
@media (min-width: 760px) { .mrow { grid-template-columns: repeat(3, minmax(0,1fr)); } }
.mcard { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); padding: 13px 14px; border-top: 2px solid var(--grey); }
.mcard[data-c="model"] { border-top-color: var(--blue); }
.mcard[data-c="tool"]  { border-top-color: var(--cyan); }
.mcard[data-c="hook"]  { border-top-color: var(--amber); }
.mcard .mc-no { font-family: var(--mono); font-size: 9.5px; color: var(--text-3); display: block; margin-bottom: 5px; }
.mcard .mc-t { font-size: 13.5px; font-weight: 600; color: #15191e; display: block; margin-bottom: 4px; }
.mcard .mc-d { font-size: 12px; line-height: 1.6; color: var(--text-3); }

.duo { display: grid; gap: 10px; margin: 0 0 16px; }
@media (min-width: 780px) { .duo { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.duo .col { overflow: hidden; }
.duo pre {
  margin: 0; border: 0; border-radius: 0; background: var(--bg-2);
  flex: 1 1 auto; min-height: 150px; max-height: 260px; overflow: auto;
  font-size: 11.5px; line-height: 1.66;
}
.duo .col-body { padding: 0; display: flex; }

/* ---------- 形态切换面板 ---------- */

.pane { display: none; }
.pane.on { display: block; }
.fig {
  position: relative; height: 210px; margin: 0 0 10px;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  padding: 14px;
  background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r);
  overflow: hidden;
}
.fig svg, .tot svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.fig .fl, .tot .fl { stroke: #b9c2cd; stroke-width: 1.3; vector-effect: non-scaling-stroke; fill: none; }
.fig.short { height: 152px; }
.fig .fl.on, .tot .fl.on { stroke: var(--amber); }


/* ---------- 链式图（CoT / ReAct） ---------- */

.chain { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0; width: 100%; }
.chain .cd {
  font-family: var(--mono); font-size: 10.5px; line-height: 1;
  padding: 8px 11px; border: 1px solid var(--line-2); border-radius: 3px;
  background: #f7f9fb; color: var(--text-3); white-space: nowrap;
}
.chain .cd.ok  { border-color: var(--green); color: #2f6b45; }
.chain .cd.cur { border-color: var(--amber); color: #15191e; }
.chain .ar { flex: 0 0 24px; height: 1px; background: #ccd3db; position: relative; margin: 0 5px; }
.chain .ar::after {
  content: ""; position: absolute; right: -1px; top: -3px; width: 0; height: 0;
  border-left: 5px solid #ccd3db; border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent;
}
.chain .cd .cs { display: block; font-size: 9.5px; color: #8b95a3; margin-top: 4px; }
.loopnote {
  margin-top: 14px; font-family: var(--mono); font-size: 10px; color: var(--amber);
  text-align: center; letter-spacing: .02em;
}


/* ---------- span 瀑布（章节 07） ---------- */

.waterfall { border: 1px solid var(--line); border-radius: var(--r); background: var(--bg-2); padding: 11px 13px 13px; }
.wf-head {
  display: grid; grid-template-columns: 132px minmax(0,1fr) 56px; gap: 9px;
  font-family: var(--mono); font-size: 9px; color: var(--text-3); letter-spacing: .06em;
  padding-bottom: 7px; border-bottom: 1px solid var(--line); margin-bottom: 7px;
}
.wf-head span:last-child { text-align: right; }
.wf-row {
  display: grid; grid-template-columns: 132px minmax(0,1fr) 56px; gap: 9px; align-items: center;
  padding: 2px 0; cursor: pointer; border-radius: 2px;
}
.wf-row:hover { background: rgba(0,0,0,0.051); }
.wf-row.sel { background: rgba(169,102,15,0.044); }
.wf-lab {
  font-family: var(--mono); font-size: 10.5px; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.wf-row.sel .wf-lab { color: var(--amber); }
.wf-track { position: relative; height: 15px; background: #fbfcfd; border-radius: 2px; overflow: hidden; }
.wf-bar { position: absolute; top: 3px; height: 9px; border-radius: 2px; background: rgba(37,99,168,0.35); }
.wf-bar[data-c="tool"] { background: rgba(15,123,131,0.35); }
.wf-bar[data-c="ok"]   { background: rgba(31,122,61,0.35); }
.wf-bar[data-c="root"] { background: rgba(169,102,15,0.294); }
.wf-ms { font-family: var(--mono); font-size: 10px; color: var(--text-3); text-align: right; }
.wf-row.sel .wf-ms { color: var(--text-2); }

@media (max-width: 560px) {
  .wf-head, .wf-row { grid-template-columns: 96px minmax(0,1fr) 46px; gap: 6px; }
  .wf-lab { font-size: 9.5px; }
}


/* ---------- 双栏舞台（章节 09） ---------- */

.duo-stage { display: grid; grid-template-columns: minmax(0,1fr); gap: 10px; margin: 20px 0 8px; }
@media (min-width: 860px) { .duo-stage { grid-template-columns: minmax(0,1.12fr) minmax(0,1fr); } }
.flow.sm { height: 206px; }

/* 退避柱 */
.bo { display: flex; align-items: flex-end; gap: 14px; height: 104px; padding: 0 4px; margin: 12px 0 6px; }
.bo-item { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 0 0 auto; }
.bo-bar { width: 34px; background: rgba(169,102,15,0.315); border-top: 2px solid var(--amber); border-radius: 1px; }
.bo-lab { font-family: var(--mono); font-size: 9.5px; color: var(--text-3); }


.sx { display: grid; grid-template-columns: minmax(0,1fr); gap: 10px; margin: 20px 0 8px; }
@media (min-width: 900px) { .sx { grid-template-columns: minmax(0,.92fr) minmax(0,1.08fr); } }

.emit {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 11px; border-top: 1px solid var(--line);
  font-family: var(--mono); font-size: 10px; color: var(--text-3);
  flex: 0 0 auto;
}
.emit-k { letter-spacing: .08em; }
.emit-c {
  display: inline-block; min-width: 15px; height: 17px; line-height: 16px; text-align: center;
  background: rgba(169,102,15,0.077); border: 1px solid rgba(169,102,15,0.266);
  color: var(--amber); border-radius: 2px; font-size: 10.5px; transition: opacity .1s;
}
.emit-d { color: var(--text-3); font-size: 9.5px; }

.ui-body { padding: 11px; }
.ui-empty { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); padding: 22px 2px; }
.bubble {
  border: 1px solid var(--line); border-radius: 3px; background: var(--panel);
  padding: 8px 10px; font-size: 12px; line-height: 1.68; color: #2a3441;
  animation: msgIn .2s ease-out;
}
.bubble .who {
  display: block; font-family: var(--mono); font-size: 9px; letter-spacing: .06em;
  color: var(--blue); margin-bottom: 4px;
}
.term {
  border: 1px solid var(--line); border-radius: 3px; background: #ffffff;
  padding: 8px 10px; font-family: var(--mono); font-size: 11px; line-height: 1.62;
  color: #3a4552; animation: msgIn .2s ease-out; margin-top: 9px;
}
.term-bar {
  display: flex; justify-content: space-between; font-size: 9px; color: var(--text-3);
  padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px solid var(--line);
}
.term pre { margin: 0; font: inherit; color: inherit; white-space: pre-wrap; word-break: break-all; }
.caret {
  display: inline-block; width: 5px; height: 11px; background: var(--amber);
  margin-left: 1px; vertical-align: -1px; animation: blink 1s step-end infinite;
}

@media (max-width: 560px) { .ui-body { padding: 9px; } .term { font-size: 10px; } }


.rail { padding: 13px 12px 11px; display: flex; flex-direction: column; justify-content: center; min-height: 100%; box-sizing: border-box; }
.rail-node {
  border: 1px solid var(--line); border-radius: 2px; background: var(--panel);
  padding: 7px 10px; font-family: var(--mono); font-size: 10.5px;
  color: var(--text-2); display: flex; align-items: center; justify-content: space-between;
  transition: border-color .18s, color .18s, background .18s;
}
.rail-node .rn-k { font-size: 8.5px; letter-spacing: .06em; color: var(--text-3); }
.rail-node[data-k="model"] { border-left: 2px solid rgba(37,99,168,0.35); }
.rail-node[data-k="tool"] { border-left: 2px solid rgba(15,123,131,0.35); }
.rail-node[data-k="done"] { border-left: 2px solid rgba(31,122,61,0.35); }
.rail-node[data-k="io"] { border-left: 2px solid #ccd3db; }
.rail-node.on {
  border-color: var(--amber); background: rgba(169,102,15,0.05); color: var(--amber);
}
.rail-node.on .rn-k { color: var(--amber); }
.rail-wire { height: 17px; margin-left: 16px; border-left: 1px solid #b9c2cd; position: relative; }
.rail-wire::after {
  content: '▼'; position: absolute; left: -4px; bottom: -6px;
  font-size: 7px; color: #b9c2cd;
}
.rail-wire.live { border-color: var(--amber); }
.rail-wire.live::after { color: var(--amber); }

.ui-run {
  font-family: var(--mono); font-size: 10px; color: var(--amber);
  display: flex; align-items: center; gap: 6px; margin-bottom: 9px;
}
.ui-run[hidden] { display: none; }
.ui-run i { width: 5px; height: 5px; border-radius: 50%; background: var(--amber); display: inline-block; animation: pulse 1.4s ease-in-out infinite; }

/* ---------- 低动效 ---------- */

@media (max-width: 700px) {
  pre { white-space: pre-wrap; word-break: break-word; }
  .tbl-wrap table { min-width: 560px; }
  .col { max-height: 320px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
  .edge.on.flow { stroke-dasharray: none; }
}

/* ---------- 浅色主题：对比度补强 & 去装饰 ---------- */

.fnode.on, .tnode.on {
  background: #fff; color: #8a5310;
  box-shadow: 0 0 0 1.5px var(--amber);
}
.fnode.on[data-k="model"], .tnode.on[data-k="model"] { color: #1d4e80; box-shadow: 0 0 0 1.5px var(--blue); }
.fnode.on[data-k="tool"],  .tnode.on[data-k="tool"]  { color: #0d6a70; box-shadow: 0 0 0 1.5px var(--cyan); }
.fnode.on[data-k="done"],  .tnode.on[data-k="done"]  { color: #1b6a35; box-shadow: 0 0 0 1.5px var(--green); }
.fnode.visited { opacity: .7; }

.edge, .edge.loop { stroke: #9aa5b3; }
.hloop .arc { stroke: rgba(37,99,168,.4); }
.hloop .arc-b { stroke: rgba(15,123,131,.4); }

.rail-node.on { background: #fff; }
.st-k { color: #5b6572; }

.fnode { background: #fff; border-color: #aab3bf; color: #2a3441; }
.fnode.visited { color: #5b6572; }
.flow-meta { color: #5b6572; }
.legend { color: #4a5462; }
.loopband { border-color: #dfe3e9; background: #fbfcfd; }
.loopband span { color: #6b7482; }
.tnode { background: #fff; border-color: #aab3bf; color: #2a3441; }

.cd { background: #fff; border-color: #c9cfd8; color: #2a3441; }
.chain .cd .cs { color: #6b7482; }

/* ---------- MCP 组合爆炸对照图 ---------- */

.mcpfig .col-body { padding: 10px 12px; overflow: visible; }
.mcpfig svg { display: block; width: 100%; height: auto; }
.mcpfig .bx   { fill: #fff; stroke: #c9cfd8; stroke-width: 1; }
.mcpfig .bt   { font-family: var(--mono); font-size: 9.5px; fill: #2a3441; }
.mcpfig .ln   { stroke: #c0c7d1; stroke-width: 1; fill: none; }

/* ---------- 通用 SVG 图（形态谱系） ---------- */

/* 流程节点：字号放大 + 按类型着色 */
.fnode {

}

.egg-img img { display: block; margin: 0 auto; max-width: min(920px, 94vw); max-height: 84vh; height: auto; border: 1px solid var(--line); border-radius: 3px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }

<body>
<script>
/* ============================================================
   Agent 原理教程 · 公共组件
   AgentFlow  跑道式循环图
   StatePanel checkpoint 面板
   LogPanel   对话记录面板
   Player     步骤播放器
   ============================================================ */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ---------- 跑道式循环图 ---------- */

const NS = 'http://www.w3.org/2000/svg';

class AgentFlow {
  constructor(root, { nodes, edges }) {
    this.root = root;
    this.nodeEls = {};
    this.edgeEls = {};
    this._build(nodes, edges);
    if (edges.some((e) => e.from && e.to)) {
      snapFlowEdges(root, nodes, edges);
      window.addEventListener('resize', () => snapFlowEdges(root, nodes, edges));
    }
  }

  _build(nodes, edges) {
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('class', 'flow-svg');
    edges.forEach((e) => {
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', e.d);
      p.setAttribute('class', 'edge' + (e.up ? ' up' : '') + (e.loop ? ' loop' : ''));
      svg.appendChild(p);
      this.edgeEls[e.id] = p;
    });
    this.root.appendChild(svg);

    const narrow = nodes.length === 8 && this.root.clientWidth > 0 && this.root.clientWidth < 720;
    if (narrow) this.root.classList.add('narrow');
    nodes.forEach((n) => {
      const el = document.createElement('div');
      el.className = 'fnode';
      el.dataset.k = n.k || 'io';
      el.style.left = n.x + '%';
      el.style.top = (narrow ? ({ start: 6, end: 6, model: 23, a_model: 23 }[n.id] || n.y) : n.y) + '%';
      el.textContent = n.label;
      if (n.tip) el.title = n.tip;
      this.root.appendChild(el);
      this.nodeEls[n.id] = el;
    });
  }

  highlight(nodeIds = [], edgeIds = []) {
    Object.entries(this.nodeEls).forEach(([id, el]) => {
      if (el.classList.contains('on')) {
        el.classList.remove('on');
        el.classList.add('visited');
      }
    });
    Object.values(this.edgeEls).forEach((el) => el.classList.remove('on', 'flow'));

    nodeIds.forEach((id) => {
      const el = this.nodeEls[id];
      if (!el) return;
      el.classList.remove('visited', 'skip');
      el.classList.add('on');
      this.root.dataset.cur = id;
    });
    edgeIds.forEach((id) => {
      const el = this.edgeEls[id];
      if (!el) return;
      el.classList.add('on', 'flow');
    });
  }

  skip(ids = []) {
    ids.forEach((id) => {
      const el = this.nodeEls[id];
      if (!el) return;
      el.classList.remove('on', 'visited');
      el.classList.add('skip');
    });
  }

  meta(txt) {
    let m = $('.flow-meta', this.root);
    if (!m) {
      m = document.createElement('div');
      m.className = 'flow-meta';
      this.root.appendChild(m);
    }
    m.innerHTML = txt;
  }

  reset() {
    Object.values(this.nodeEls).forEach((el) => el.classList.remove('on', 'visited', 'skip'));
    Object.values(this.edgeEls).forEach((el) => el.classList.remove('on', 'flow'));
    this.root.dataset.cur = '';
    const m = $('.flow-meta', this.root);
    if (m) m.innerHTML = '';
  }
}

/* ---------- 给 flow 的边画箭头（viewBox 非等比缩放，按屏幕像素反算用户单位） ---------- */

function addFlowArrows(svgEl, edgeEls, opts) {
  const size = (opts && opts.size) || 9;
  const map = {};
  function draw() {
    Array.from(svgEl.querySelectorAll('.arw-poly')).forEach((el) => el.remove());
    const box = svgEl.getBoundingClientRect();
    if (!box.width || !box.height) return;
    const sx = box.width / 100, sy = box.height / 100;
    Object.entries(edgeEls).forEach(([id, pathEl]) => {
      const nums = (pathEl.getAttribute('d') || '').match(/-?\d+(?:\.\d+)?/g);
      if (!nums || nums.length < 4) return;
      const n = nums.map(Number);
      const ex = n[n.length - 2], ey = n[n.length - 1];
      const cx = n[n.length - 4], cy = n[n.length - 3];
      const ang = Math.atan2((ey - cy) * sy, (ex - cx) * sx);
      const L = size, HW = size * 0.36;
      const bx = ex - Math.cos(ang) * L / sx, by = ey - Math.sin(ang) * L / sy;
      const ox = -Math.sin(ang) * HW / sx, oy = Math.cos(ang) * HW / sy;
      const poly = document.createElementNS(NS, 'polygon');
      poly.setAttribute('points', `${ex},${ey} ${bx + ox},${by + oy} ${bx - ox},${by - oy}`);
      poly.setAttribute('class', 'arw-poly');
      svgEl.appendChild(poly);
      map[id] = poly;
    });
  }
  draw();
  window.addEventListener('resize', draw);
  return map;
}

/* 标准 8 节点闭环：与「中间件全景」同一张图，6 个节点围一圈，两个 agent 钩子在两侧上方 */
const STD_NODES = [
  { id: 'start',   label: 'before_agent', x: 10, y: 12, k: 'hook' },
  { id: 'b_model', label: 'before_model', x: 15, y: 46, k: 'hook' },
  { id: 'model',   label: 'model_call',   x: 30, y: 18, k: 'model' },
  { id: 'a_model', label: 'after_model',  x: 70, y: 18, k: 'hook' },
  { id: 'b_tool',  label: 'before_tool',  x: 85, y: 46, k: 'hook' },
  { id: 'tool',    label: 'tool_call',    x: 70, y: 78, k: 'tool' },
  { id: 'a_tool',  label: 'after_tool',   x: 30, y: 78, k: 'hook' },
  { id: 'end',     label: 'after_agent',  x: 88, y: 12, k: 'done' },
];

const STD_EDGES = [
  { id: 'e_start',  from: 'start',   to: 'b_model', d: 'M10 15 C11 26, 12 35, 13 42' },
  { id: 'e_bm',     from: 'b_model', to: 'model',   d: 'M17 43 C22 35, 24.5 28, 27 22.5' },
  { id: 'e_m',      from: 'model',   to: 'a_model', d: 'M34 18 L65.6 18' },
  { id: 'e_am_bt',  from: 'a_model', to: 'b_tool',  d: 'M70.5 22.5 C74 30, 78 36, 81.5 41.5' },
  { id: 'e_bt',     from: 'b_tool',  to: 'tool',    d: 'M85 50 C82 60, 76 68, 71.5 73.5' },
  { id: 'e_t',      from: 'tool',    to: 'a_tool',  d: 'M66.5 78 L34.5 78' },
  { id: 'e_loop',   from: 'a_tool',  to: 'b_model', d: 'M29 73.5 C25 66, 21 58, 18 50.5', loop: true },
  { id: 'e_exit',   from: 'a_model', to: 'end',     d: 'M73.5 15 C77 12.5, 81 11.5, 83.5 12' },
];

/* 端点吸附：按节点框的实际像素把边的首尾拉到框边，字号变了也不会缩进框里 */
function snapFlowEdges(root, nodes, edges) {
  const fr = root.getBoundingClientRect();
  if (!fr.width) return;
  const box = {};
  const els = root.querySelectorAll('.fnode');
  nodes.forEach((n, i) => {
    const el = els[i];
    if (!el) return;
    const r = el.getBoundingClientRect();
    box[n.id] = {
      cx: (r.left + r.width / 2 - fr.left) / fr.width * 100,
      cy: (r.top + r.height / 2 - fr.top) / fr.height * 100,
      hw: r.width / 2 / fr.width * 100,
      hh: r.height / 2 / fr.height * 100,
    };
  });
  function hit(c, tx, ty) {
    const dx = tx - c.cx, dy = ty - c.cy;
    if (!dx && !dy) return [c.cx, c.cy];
    const t = Math.min(Math.abs(dx) ? c.hw / Math.abs(dx) : 1e9, Math.abs(dy) ? c.hh / Math.abs(dy) : 1e9);
    return [c.cx + dx * t, c.cy + dy * t];
  }
  edges.forEach((e, i) => {
    if (!e.from || !e.to) return;
    const path = root.querySelectorAll('svg .edge')[i];
    const a = box[e.from], b = box[e.to];
    if (!path || !a || !b) return;
    const nums = (path.getAttribute('d') || '').match(/-?\d+(?:\.\d+)?/g);
    if (!nums || nums.length < 4) return;
    const n = nums.map(Number);
    const ctrl = n.slice(2, n.length - 2);
    const sPt = hit(a, ctrl.length ? ctrl[0] : b.cx, ctrl.length ? ctrl[1] : b.cy);
    const q = n.length >= 6 ? [n[n.length - 4], n[n.length - 3]] : [a.cx, a.cy];
    const tPt = hit(b, q[0], q[1]);
    path.setAttribute('d', ctrl.length
      ? 'M ' + sPt[0].toFixed(2) + ' ' + sPt[1].toFixed(2) + ' C ' + ctrl.join(' ') + ', ' + tPt[0].toFixed(2) + ' ' + tPt[1].toFixed(2)
      : 'M ' + sPt[0].toFixed(2) + ' ' + sPt[1].toFixed(2) + ' L ' + tPt[0].toFixed(2) + ' ' + tPt[1].toFixed(2));
  });
}

/* ---------- checkpoint 面板 ---------- */

class StatePanel {
  constructor(el) {
    this.el = el;
    this.prev = {};
    this.rows = {};
    this.render({});
  }

  render(obj) {
    const keys = Object.keys(obj);
    this.el.innerHTML = '';
    this.rows = {};
    if (!keys.length) {
      this.el.innerHTML = '<div class="st-empty">— 尚未初始化 —</div>';
      this.prev = {};
      return;
    }
    const box = document.createElement('div');
    box.className = 'st-body';
    keys.forEach((k) => {
      const row = document.createElement('div');
      row.className = 'st-row';
      const changed = JSON.stringify(obj[k]) !== JSON.stringify(this.prev[k]);
      if (changed && this.prev[k] !== undefined) row.classList.add('flash');
      row.innerHTML = `<span class="st-k">${esc(k)}</span><span class="st-v">${obj[k]}</span>`;
      box.appendChild(row);
      this.rows[k] = row;
    });
    this.el.appendChild(box);
    this.prev = JSON.parse(JSON.stringify(obj));
  }

  reset() {
    this.prev = {};
    this.el.innerHTML = '<div class="st-empty">— 尚未初始化 —</div>';
  }
}

/* ---------- 对话记录面板 ---------- */

class LogPanel {
  constructor(el) {
    this.el = el;
    this.n = 0;
  }

  push(role, html) {
    const d = document.createElement('div');
    d.className = 'msg';
    d.dataset.r = role;
    d.innerHTML = `<span class="msg-r">${esc(role)}</span><span class="msg-b">${html}</span>`;
    this.el.appendChild(d);
    this.el.scrollTop = this.el.scrollHeight;
    this.n++;
    return d;
  }

  clear() {
    this.el.innerHTML = '';
    this.n = 0;
  }
}

/* ---------- 步骤播放器 ---------- */

class Player {
  constructor({ steps, apply, resetAll, box, autoMs = 1500, min = -1 }) {
    this.steps = steps;
    this.apply = apply;
    this.resetAll = resetAll;
    this.box = box;
    this.min = min;
    this.cur = min - 1;
    this.timer = null;
    this.autoMs = autoMs;
    this._wire();
    this._sync();
  }

  _wire() {
    const b = this.box;
    if (b.next) b.next.addEventListener('click', () => this.next());
    if (b.prev) b.prev.addEventListener('click', () => this.go(this.cur - 1));
    if (b.reset) b.reset.addEventListener('click', () => this.go(-1));
    if (b.auto) {
      b.auto.addEventListener('click', () => (this.timer ? this.stop() : this.play()));
    }
    document.addEventListener('keydown', (e) => {
      if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); this.next(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); this.go(this.cur - 1); }
      if (e.key === 'r' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); this.go(-1); }
    });
  }

  stop() {
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
    if (this.box.auto) this.box.auto.textContent = '自动';
    this._sync();
  }

  play() {
    if (this.cur >= this.steps.length - 1) this.go(-1);
    this.box.auto.textContent = '暂停';
    const tick = () => {
      if (this.cur >= this.steps.length - 1) { this.stop(); return; }
      this.next();
      this.timer = setTimeout(tick, this.autoMs);
    };
    this.timer = setTimeout(tick, 120);
  }

  next() {
    if (this.cur < this.steps.length - 1) this.go(this.cur + 1);
    else this.stop();
  }

  go(i) {
    i = Math.max(this.min, Math.min(i, this.steps.length - 1));
    if (i === this.cur) return;
    if (i <= this.cur || this.cur < this.min) {
      this.resetAll();
      this.cur = this.min - 1;
    }
    for (let j = this.cur + 1; j <= i; j++) this.apply(this.steps[j], j);
    this.cur = i;
    if (i < this.steps.length - 1 && this.timer) return; // 自动播放继续
    this._sync();
  }

  _sync() {
    const b = this.box;
    const last = this.steps.length - 1;
    if (b.next) b.next.disabled = this.cur >= last;
    if (b.prev) b.prev.disabled = this.cur <= this.min;
    if (b.total) b.total.innerHTML = `<b>${Math.max(0, this.cur + 1)}</b> / ${this.steps.length}`;
  }
}

/* ---------- 打字机 ---------- */

function typeInto(el, text, msPerChar, onDone) {
  let i = 0;
  el.textContent = '';
  const step = () => {
    if (i >= text.length) { if (onDone) onDone(); return; }
    el.textContent += text[i++];
    setTimeout(step, msPerChar);
  };
  step();
}

/* ---------- 折叠面板 ---------- */

function bindTimeline(selector = '.tl-item') {
  $$(selector).forEach((item) => {
    item.addEventListener('click', () => {
      const open = item.hasAttribute('data-open');
      $$(selector).forEach((o) => { o.removeAttribute('data-open'); const p = $('.tl-panel', o); if (p) p.hidden = true; });
      if (!open) {
        item.setAttribute('data-open', '');
        const p = $('.tl-panel', item);
        if (p) p.hidden = false;
      }
    });
  });
}

function bindSeg(selector, onChange) {
  $$(selector).forEach((btn) => {
    btn.addEventListener('click', () => {
      $$(selector).forEach((b) => b.setAttribute('aria-selected', 'false'));
      btn.setAttribute('aria-selected', 'true');
      onChange(btn.dataset.v);
    });
  });
}
